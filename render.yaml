# Render Blueprint: creates the NEC Suite web service. The data lives in Supabase
# (see DEPLOY.md). In Render: New > Blueprint > pick this repository. You will be
# asked for SUITE_PASSWORD and DATABASE_URL.
services:
  - type: web
    name: nec-suite
    runtime: node
    # Close to New York and to the Supabase region East US (North Virginia).
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUITE_PASSWORD
        sync: false
      # Supabase > Connect > Session pooler connection string, with the database password in it.
      - key: DATABASE_URL
        sync: false
